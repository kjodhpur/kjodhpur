<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><rect width="860" height="220" rx="12" fill="url(#bg)"/><rect x="0.5" y="0.5" width="859" height="219" rx="12" fill="none" stroke="#30363d"/><line x1="0" y1="30" x2="860" y2="30" stroke="#30363d"/><circle cx="24" cy="15.0" r="5" fill="#ff5f56"/><circle cx="40" cy="15.0" r="5" fill="#ffbd2e"/><circle cx="56" cy="15.0" r="5" fill="#27c93f"/><text x="430.0" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">kanha@github: ~$ fortune</text><text x="24" y="66" fill="#7d8590" font-size="14">$ echo <tspan fill="#39d353">$QUOTE</tspan></text><g id="q0" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0154;0.1250;0.1404;1" dur="45.60s" begin="0.00s" repeatCount="indefinite"/><text x="24" y="108" fill="#e6edf3" font-size="18" font-weight="600">Build for the user you serve, not the slide you present.</text><text x="24" y="154" fill="#58a6ff" font-size="14">— Unknown</text></g><g id="q1" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0154;0.1250;0.1404;1" dur="45.60s" begin="5.70s" repeatCount="indefinite"/><text x="24" y="108" fill="#e6edf3" font-size="18" font-weight="600">Start where you are. Use what you have. Do what you can.</text><text x="24" y="154" fill="#58a6ff" font-size="14">— Arthur Ashe</text></g><g id="q2" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0154;0.1250;0.1404;1" dur="45.60s" begin="11.40s" repeatCount="indefinite"/><text x="24" y="108" fill="#e6edf3" font-size="18" font-weight="600">Small teams, sharp problems, honest feedback.</text><text x="24" y="154" fill="#58a6ff" font-size="14">— Unknown</text></g><g id="q3" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0154;0.1250;0.1404;1" dur="45.60s" begin="17.10s" repeatCount="indefinite"/><text x="24" y="108" fill="#e6edf3" font-size="18" font-weight="600">Clarity is kindness — in product and in people.</text><text x="24" y="154" fill="#58a6ff" font-size="14">— Unknown</text></g><g id="q4" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0154;0.1250;0.1404;1" dur="45.60s" begin="22.80s" repeatCount="indefinite"/><text x="24" y="108" fill="#e6edf3" font-size="18" font-weight="600">Partnerships turn good products into lasting ones.</text><text x="24" y="154" fill="#58a6ff" font-size="14">— Unknown</text></g><g id="q5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0154;0.1250;0.1404;1" dur="45.60s" begin="28.50s" repeatCount="indefinite"/><text x="24" y="108" fill="#e6edf3" font-size="18" font-weight="600">Be stubborn on vision, flexible on details.</text><text x="24" y="154" fill="#58a6ff" font-size="14">— Jeff Bezos</text></g><g id="q6" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0154;0.1250;0.1404;1" dur="45.60s" begin="34.20s" repeatCount="indefinite"/><text x="24" y="108" fill="#e6edf3" font-size="18" font-weight="600">Focus is a force multiplier.</text><text x="24" y="154" fill="#58a6ff" font-size="14">— Unknown</text></g><g id="q7" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0154;0.1250;0.1404;1" dur="45.60s" begin="39.90s" repeatCount="indefinite"/><text x="24" y="108" fill="#e6edf3" font-size="18" font-weight="600">The only way to do great work is to love what you do.</text><text x="24" y="154" fill="#58a6ff" font-size="14">— Steve Jobs</text></g><text x="24" y="202" fill="#7d8590" font-size="11">// rotates on view · reshuffled when profile art refreshes</text></svg>