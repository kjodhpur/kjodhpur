name: Update profile art

# Refreshes contribution graph, stats card, and fortune quotes.
# Keeps the existing contribution-snake workflow separate.

"on":
  schedule:
    - cron: "0 * * * *"      # hourly — reshuffles fortune quotes often
    - cron: "17 6 * * *"     # daily full refresh (kept)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape contribution data
        env:
          GH_PROFILE_USER: kjodhpur
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph
        run: python scripts/generate_streak_svg.py kjodhpur contrib-heatmap.svg

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Render fortune quotes panel
        run: python scripts/render_quotes_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg quotes.svg"
