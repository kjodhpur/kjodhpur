name: Metrics
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Isometric calendar only — no header (avoids redundant joined/followers under the name)
      - name: Metrics · calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kjodhpur
          template: classic
          base: ""
          filename: metrics.overview.svg
          output_action: commit
          committer_message: "chore(metrics): update calendar"
          config_timezone: America/Phoenix
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Metrics · languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kjodhpur
          template: classic
          base: ""
          filename: metrics.languages.svg
          output_action: commit
          committer_message: "chore(metrics): update languages"
          plugin_languages: yes
          plugin_languages_ignored: html, css, makefile, less, dockerfile, shell
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_other: yes
